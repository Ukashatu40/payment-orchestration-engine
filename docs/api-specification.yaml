openapi: 3.0.0
paths:
  /api/v1/health:
    get:
      operationId: AppController_health_v1
      parameters: []
      responses:
        '200':
          description: Health check passed
      security:
        - X-API-Key: []
      summary: Check application health
      tags:
        - health
  /api/v1/gateways:
    get:
      operationId: GatewaysController_listGateways_v1
      parameters: []
      responses:
        '200':
          description: List of payment gateways retrieved
      security: &ref_0
        - X-API-Key: []
      summary: List all payment gateways
      tags: &ref_1
        - gateways
  /api/v1/gateways/{name}/health:
    get:
      operationId: GatewaysController_getGatewayHealth_v1
      parameters:
        - name: name
          required: true
          in: path
          schema:
            type: string
      responses:
        '200':
          description: Health status retrieved
      security: *ref_0
      summary: Get health status of a payment gateway
      tags: *ref_1
  /api/v1/gateways/{name}/metrics:
    get:
      operationId: GatewaysController_getGatewayMetrics_v1
      parameters:
        - name: name
          required: true
          in: path
          schema:
            type: string
      responses:
        '200':
          description: Metrics retrieved
      security: *ref_0
      summary: Get metrics for a payment gateway
      tags: *ref_1
  /api/v1/gateways/{name}/config:
    put:
      operationId: GatewaysController_updateGatewayConfig_v1
      parameters:
        - name: name
          required: true
          in: path
          description: Payment gateway name
          schema:
            enum:
              - RAZORPAY
              - STRIPE
              - PAYU
              - UPI
              - PAYSTACK
              - FLUTTERWAVE
              - INTERSWITCH
              - OPAY
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                isEnabled:
                  type: boolean
                cbFailureThreshold:
                  type: number
                  minimum: 0
                  maximum: 1
              example:
                isEnabled: true
                cbFailureThreshold: 0.3
      responses:
        '200':
          description: Configuration updated
      security: *ref_0
      summary: Update configuration for a payment gateway
      tags: *ref_1
  /api/v1/gateways/routing/config:
    get:
      operationId: GatewaysController_getRoutingConfig_v1
      parameters: []
      responses:
        '200':
          description: Routing configuration retrieved
      security: *ref_0
      summary: Get current routing configuration
      tags: *ref_1
    put:
      operationId: GatewaysController_updateRoutingConfig_v1
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                weightSuccessRate:
                  type: number
                  minimum: 0
                  maximum: 1
                weightLatency:
                  type: number
                  minimum: 0
                  maximum: 1
                weightCost:
                  type: number
                  minimum: 0
                  maximum: 1
                weightHealth:
                  type: number
                  minimum: 0
                  maximum: 1
                weightFit:
                  type: number
                  minimum: 0
                  maximum: 1
              example:
                weightSuccessRate: 0.4
                weightLatency: 0.2
                weightCost: 0.2
                weightHealth: 0.1
                weightFit: 0.1
      responses:
        '200':
          description: Routing configuration updated
      security: *ref_0
      summary: Update routing configuration
      tags: *ref_1
  /api/v1/payments:
    post:
      operationId: TransactionsController_initiatePayment_v1
      parameters:
        - name: x-merchant-id
          required: true
          in: header
          description: Merchant UUID
          schema:
            type: string
        - name: idempotency-key
          required: true
          in: header
          description: UUID v4 idempotency key
          schema:
            type: string
        - name: x-mock-response
          required: true
          in: header
          schema:
            type: string
        - name: x-mock-delay-ms
          required: true
          in: header
          schema:
            type: string
        - name: x-mock-gateway-down
          required: true
          in: header
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InitiatePaymentRequestDto'
      responses:
        '201':
          description: Payment initiated successfully
        '400':
          description: Validation error
        '401':
          description: Invalid or missing API key
        '409':
          description: Idempotency conflict — request in progress
        '503':
          description: No gateway available
      summary: Initiate a new payment
      tags: &ref_2
        - Transactions
    get:
      operationId: TransactionsController_getByMerchantOrderId_v1
      parameters:
        - name: merchant_order_id
          required: true
          in: query
          schema:
            type: string
        - name: x-merchant-id
          required: true
          in: header
          schema:
            type: string
      responses:
        '200':
          description: ''
      tags: *ref_2
  /api/v1/payments/{id}:
    get:
      operationId: TransactionsController_getPayment_v1
      parameters:
        - name: id
          required: true
          in: path
          schema:
            type: string
      responses:
        '200':
          description: Payment found
        '404':
          description: Payment not found
      summary: Retrieve payment details by ID
      tags: *ref_2
  /api/v1/payments/{id}/capture:
    post:
      operationId: TransactionsController_capturePayment_v1
      parameters:
        - name: id
          required: true
          in: path
          schema:
            type: string
        - name: x-merchant-id
          required: true
          in: header
          schema:
            type: string
      requestBody:
        required: true
        description: Optional amount to capture (for partial captures)
        content:
          application/json:
            schema:
              type: object
              properties:
                amountPaise:
                  type: integer
                  minimum: 1
              example:
                amountPaise: 5000
      responses:
        '200':
          description: Payment captured
        '422':
          description: Invalid state transition
      summary: Capture an authorised payment
      tags: *ref_2
  /api/v1/payments/{id}/void:
    post:
      operationId: TransactionsController_voidPayment_v1
      parameters:
        - name: id
          required: true
          in: path
          schema:
            type: string
        - name: x-merchant-id
          required: true
          in: header
          schema:
            type: string
      responses:
        '200':
          description: Payment voided
        '422':
          description: Invalid state transition
      summary: Void an authorised payment
      tags: *ref_2
  /api/v1/payments/{id}/refund:
    post:
      operationId: TransactionsController_refundPayment_v1
      parameters:
        - name: id
          required: true
          in: path
          schema:
            type: string
        - name: x-merchant-id
          required: true
          in: header
          schema:
            type: string
      requestBody:
        required: true
        description: Refund amount and reason
        content:
          application/json:
            schema:
              type: object
              properties:
                amountPaise:
                  type: integer
                  minimum: 1
                reason:
                  type: string
                idempotencyKey:
                  type: string
                  format: uuid
              required:
                - amountPaise
                - idempotencyKey
              example:
                amountPaise: 5000
                reason: Customer requested refund
                idempotencyKey: 123e4567-e89b-12d3-a456-426614174000
      responses:
        '200':
          description: Payment refunded
        '422':
          description: Invalid state transition
      summary: Refund a completed payment
      tags: *ref_2
  /api/v1/payments/{id}/timeline:
    get:
      operationId: TransactionsController_getTimeline_v1
      parameters:
        - name: id
          required: true
          in: path
          schema:
            type: string
      responses:
        '200':
          description: Timeline retrieved
        '404':
          description: Payment not found
      summary: Retrieve payment timeline
      tags: *ref_2
  /api/v1/payments/{id}/refunds:
    get:
      operationId: TransactionsController_getRefunds_v1
      parameters:
        - name: id
          required: true
          in: path
          schema:
            type: string
      responses:
        '200':
          description: Refunds retrieved
        '404':
          description: Payment not found
      summary: List refunds for a payment
      tags: *ref_2
  /api/v1/payments/analytics/success-rate:
    get:
      operationId: TransactionsController_getSuccessRate_v1
      parameters:
        - name: to
          required: false
          in: query
          description: End date for analytics (ISO 8601 format)
          schema: {}
        - name: from
          required: false
          in: query
          description: Start date for analytics (ISO 8601 format)
          schema: {}
      responses:
        '200':
          description: Success rate analytics retrieved
      summary: Get payment success rate analytics
      tags: *ref_2
  /api/v1/payments/analytics/volume:
    get:
      operationId: TransactionsController_getVolume_v1
      parameters:
        - name: to
          required: false
          in: query
          description: End date for analytics (ISO 8601 format)
          schema: {}
        - name: from
          required: false
          in: query
          description: Start date for analytics (ISO 8601 format)
          schema: {}
      responses:
        '200':
          description: Volume analytics retrieved
      summary: Get payment volume analytics
      tags: *ref_2
  /api/v1/webhooks/razorpay:
    post:
      operationId: WebhooksController_razorpayWebhook_v1
      parameters: []
      responses:
        '200':
          description: Webhook received
      security: &ref_3
        - X-API-Key: []
      summary: Handle Razorpay webhook
      tags: &ref_4
        - webhooks
  /api/v1/webhooks/stripe:
    post:
      operationId: WebhooksController_stripeWebhook_v1
      parameters: []
      responses:
        '200':
          description: Webhook received
      security: *ref_3
      summary: Handle Stripe webhook
      tags: *ref_4
  /api/v1/webhooks/payu:
    post:
      operationId: WebhooksController_payuWebhook_v1
      parameters: []
      responses:
        '200':
          description: Webhook received
      security: *ref_3
      summary: Handle PayU webhook
      tags: *ref_4
  /api/v1/webhooks/upi:
    post:
      operationId: WebhooksController_upiWebhook_v1
      parameters: []
      responses:
        '200':
          description: Webhook received
      security: *ref_3
      summary: Handle UPI webhook
      tags: *ref_4
  /api/v1/webhooks/paystack:
    post:
      operationId: WebhooksController_paystackWebhook_v1
      parameters: []
      responses:
        '200':
          description: Webhook received
      security: *ref_3
      summary: Handle Paystack webhook
      tags: *ref_4
  /api/v1/webhooks/flutterwave:
    post:
      operationId: WebhooksController_flutterwaveWebhook_v1
      parameters: []
      responses:
        '200':
          description: Webhook received
      security: *ref_3
      summary: Handle Flutterwave webhook
      tags: *ref_4
  /api/v1/webhooks/interswitch:
    post:
      operationId: WebhooksController_interswitchWebhook_v1
      parameters: []
      responses:
        '200':
          description: Webhook received
      security: *ref_3
      summary: Handle Interswitch webhook
      tags: *ref_4
  /api/v1/webhooks/opay:
    post:
      operationId: WebhooksController_opayWebhook_v1
      parameters: []
      responses:
        '200':
          description: Webhook received
      security: *ref_3
      summary: Handle Opay webhook
      tags: *ref_4
  /api/v1/webhooks/dlq:
    get:
      operationId: WebhooksController_getDLQ_v1
      parameters:
        - name: gateway
          required: true
          in: query
          schema:
            type: string
      responses:
        '200':
          description: Failed webhooks retrieved
      security: *ref_3
      summary: Retrieve failed webhooks
      tags: *ref_4
  /api/v1/webhooks/dlq/{id}/replay:
    post:
      operationId: WebhooksController_replayDLQ_v1
      parameters:
        - name: id
          required: true
          in: path
          schema:
            type: string
      responses:
        '200':
          description: Webhook replayed
      security: *ref_3
      summary: Replay a failed webhook
      tags: *ref_4
  /api/v1/reconciliation/trigger:
    post:
      operationId: ReconciliationController_triggerReconciliation_v1
      parameters: []
      responses:
        '200':
          description: Reconciliation triggered
      security: &ref_5
        - X-API-Key: []
      summary: Trigger reconciliation process
      tags: &ref_6
        - reconciliation
  /api/v1/reconciliation/reports/{runId}:
    get:
      operationId: ReconciliationController_getReport_v1
      parameters:
        - name: runId
          required: true
          in: path
          schema:
            type: string
      responses:
        '200':
          description: Report retrieved
      security: *ref_5
      summary: Get reconciliation report
      tags: *ref_6
  /api/v1/reconciliation/anomalies:
    get:
      operationId: ReconciliationController_getAnomalies_v1
      parameters: []
      responses:
        '200':
          description: Anomalies retrieved
      security: *ref_5
      summary: Get unresolved anomalies
      tags: *ref_6
info:
  title: PayFlow Orchestration Layer
  description: >-
    Production-grade payment orchestration API routing transactions across
    Razorpay, Stripe, PayU, UPI, Paystack, Flutterwave, Interswitch, and Opay
    with intelligent failover, idempotency, and complete audit trails.
  version: 1.0.0
  contact: {}
tags:
  - name: payments
    description: Payment initiation, capture, void, refund
  - name: webhooks
    description: Gateway webhook receivers and DLQ management
  - name: gateways
    description: Gateway health, metrics, and configuration
  - name: reconciliation
    description: Batch reconciliation and anomaly detection
  - name: analytics
    description: Transaction volume and success rate analytics
  - name: health
    description: System health check
servers: []
components:
  securitySchemes:
    X-API-Key:
      type: apiKey
      in: header
      name: X-API-Key
  schemas:
    InitiatePaymentRequestDto:
      type: object
      properties: {}
