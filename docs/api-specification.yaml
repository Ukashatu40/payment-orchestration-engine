info:
  title: PayFlow Orchestration Layer
  description: >-
    Production-grade payment orchestration API routing transactions across
    Razorpay, Stripe, PayU, UPI, Paystack, Flutterwave, Interswitch, and Opay
    with intelligent failover, idempotency, and complete audit trails.
  version: 1.0.0
  contact: {}
tags:
  - name: payments
    description: Payment initiation, capture, void, refund
  - name: webhooks
    description: Gateway webhook receivers and DLQ management
  - name: gateways
    description: Gateway health, metrics, and configuration
  - name: reconciliation
    description: Batch reconciliation and anomaly detection
  - name: analytics
    description: Transaction volume and success rate analytics
  - name: health
    description: System health check
servers: []
components:
  securitySchemes:
    X-API-Key:
      type: apiKey
      in: header
      name: X-API-Key
  schemas:
    UserSummaryDto:
      type: object
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
        role:
          type: string
          enum:
            - SUPER_ADMIN
            - OPS_ADMIN
            - OPS_VIEWER
            - MERCHANT_ADMIN
            - MERCHANT_VIEWER
        merchantId:
          type: string
          format: uuid
          nullable: true
        status:
          type: string
          enum:
            - ACTIVE
            - DISABLED
        lastLoginAt:
          type: string
          format: date-time
          nullable: true
        failedLoginCount:
          type: number
        lockedUntil:
          type: string
          format: date-time
          nullable: true
        createdAt:
          type: string
          format: date-time
      required:
        - id
        - email
        - role
        - merchantId
        - status
        - lastLoginAt
        - failedLoginCount
        - lockedUntil
        - createdAt
    ListUsersResponseDto:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/UserSummaryDto'
        page:
          type: number
        pageSize:
          type: number
        total:
          type: number
        totalPages:
          type: number
      required:
        - data
        - page
        - pageSize
        - total
        - totalPages
    CreateUserDto:
      type: object
      properties:
        email:
          type: string
        password:
          type: string
          minLength: 8
        role:
          type: string
          enum:
            - SUPER_ADMIN
            - OPS_ADMIN
            - OPS_VIEWER
            - MERCHANT_ADMIN
            - MERCHANT_VIEWER
        merchantId:
          type: string
          format: uuid
      required:
        - email
        - password
        - role
    UpdateUserRoleDto:
      type: object
      properties:
        role:
          type: string
          enum:
            - SUPER_ADMIN
            - OPS_ADMIN
            - OPS_VIEWER
            - MERCHANT_ADMIN
            - MERCHANT_VIEWER
        merchantId:
          type: string
          format: uuid
      required:
        - role
    UpdateUserStatusDto:
      type: object
      properties:
        status:
          type: string
          enum:
            - ACTIVE
            - DISABLED
      required:
        - status
    LoginDto:
      type: object
      properties:
        email:
          type: string
          example: ops-admin@payflow.example
        password:
          type: string
          minLength: 8
          format: password
      required:
        - email
        - password
    SessionUserDto:
      type: object
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
        role:
          type: string
          enum:
            - SUPER_ADMIN
            - OPS_ADMIN
            - OPS_VIEWER
            - MERCHANT_ADMIN
            - MERCHANT_VIEWER
        merchantId:
          type: string
          format: uuid
          nullable: true
      required:
        - id
        - email
        - role
        - merchantId
    MeResponseDto:
      type: object
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
        role:
          type: string
          enum:
            - SUPER_ADMIN
            - OPS_ADMIN
            - OPS_VIEWER
            - MERCHANT_ADMIN
            - MERCHANT_VIEWER
        merchantId:
          type: string
          format: uuid
          nullable: true
        lastLoginAt:
          type: string
          format: date-time
          nullable: true
      required:
        - id
        - email
        - role
        - merchantId
        - lastLoginAt
    GatewaySummaryDto:
      type: object
      properties:
        gateway:
          type: string
          enum:
            - RAZORPAY
            - STRIPE
            - PAYU
            - UPI
            - PAYSTACK
            - FLUTTERWAVE
            - INTERSWITCH
            - OPAY
        isEnabled:
          type: boolean
        healthScore:
          type: number
          description: 0-1 rolling health score derived from the circuit breaker
        circuitState:
          type: string
          enum:
            - CLOSED
            - OPEN
            - HALF_OPEN
        supportedMethods:
          type: array
          items:
            type: string
      required:
        - gateway
        - isEnabled
        - healthScore
        - supportedMethods
    CircuitBreakerEntryDto:
      type: object
      properties:
        gateway:
          type: string
          enum:
            - RAZORPAY
            - STRIPE
            - PAYU
            - UPI
            - PAYSTACK
            - FLUTTERWAVE
            - INTERSWITCH
            - OPAY
        paymentMethod:
          type: string
          enum:
            - CARD_CREDIT
            - CARD_DEBIT
            - UPI
            - NET_BANKING
            - WALLET
            - BANK_TRANSFER
            - USSD
            - MOBILE_MONEY
            - VIRTUAL_ACCOUNT
          nullable: true
          description: null = applies to all methods
        state:
          type: string
          enum:
            - CLOSED
            - OPEN
            - HALF_OPEN
        failureCount:
          type: number
        lastFailureAt:
          type: string
          format: date-time
          nullable: true
        openedAt:
          type: string
          format: date-time
          nullable: true
        halfOpenAt:
          type: string
          format: date-time
          nullable: true
        successCountInHalfOpen:
          type: number
      required:
        - gateway
        - paymentMethod
        - state
        - failureCount
        - lastFailureAt
        - openedAt
        - halfOpenAt
        - successCountInHalfOpen
    GatewayHealthDto:
      type: object
      properties:
        gateway:
          type: string
          enum:
            - RAZORPAY
            - STRIPE
            - PAYU
            - UPI
            - PAYSTACK
            - FLUTTERWAVE
            - INTERSWITCH
            - OPAY
        isEnabled:
          type: boolean
        cbFailureThreshold:
          type: number
          description: Consecutive failure count that trips the circuit breaker open
        circuitBreakerStates:
          type: array
          items:
            $ref: '#/components/schemas/CircuitBreakerEntryDto'
      required:
        - gateway
        - isEnabled
        - cbFailureThreshold
        - circuitBreakerStates
    GatewayMetricsDto:
      type: object
      properties:
        gateway:
          type: string
          enum:
            - RAZORPAY
            - STRIPE
            - PAYU
            - UPI
            - PAYSTACK
            - FLUTTERWAVE
            - INTERSWITCH
            - OPAY
        successRate:
          type: number
          description: Fraction between 0 and 1
        p95LatencyMs:
          type: number
        totalCount:
          type: number
      required:
        - gateway
        - successRate
        - p95LatencyMs
        - totalCount
    GatewayConfigUpdateResultDto:
      type: object
      properties:
        updated:
          type: boolean
        gateway:
          type: string
          enum:
            - RAZORPAY
            - STRIPE
            - PAYU
            - UPI
            - PAYSTACK
            - FLUTTERWAVE
            - INTERSWITCH
            - OPAY
      required:
        - updated
        - gateway
    RoutingConfigResponseDto:
      type: object
      properties:
        configKey:
          type: string
        weightSuccessRate:
          type: number
        weightLatency:
          type: number
        weightCost:
          type: number
        weightHealth:
          type: number
        weightFit:
          type: number
        slidingWindowMinutes:
          type: number
        degradedSkipThreshold:
          type: number
        updatedAt:
          type: string
          format: date-time
      required:
        - configKey
        - weightSuccessRate
        - weightLatency
        - weightCost
        - weightHealth
        - weightFit
        - slidingWindowMinutes
        - degradedSkipThreshold
        - updatedAt
    InitiatePaymentRequestDto:
      type: object
      properties: {}
    PaymentResponseDto:
      type: object
      properties:
        id:
          type: string
          format: uuid
        merchantId:
          type: string
          format: uuid
        merchantOrderId:
          type: string
        amountPaise:
          type: number
          description: bigint → number for JSON serialisation
        amountRupees:
          type: number
        capturedPaise:
          type: number
        refundedPaise:
          type: number
        currency:
          type: string
        state:
          type: string
          enum:
            - CREATED
            - ROUTE_SELECTED
            - AUTH_INITIATED
            - AUTHORISED
            - AUTH_FAILED
            - AUTH_TIMEOUT
            - AUTH_EXPIRED
            - CAPTURE_INITIATED
            - CAPTURED
            - PARTIALLY_CAPTURED
            - CAPTURE_FAILED
            - VOID_INITIATED
            - VOIDED
            - REFUND_INITIATED
            - REFUNDED
            - PARTIALLY_REFUNDED
            - REFUND_FAILED
            - SETTLED
            - DISPUTE_OPENED
            - DISPUTE_RESOLVED
            - ABANDONED
            - ROUTE_FAILED
            - FAILED
        paymentMethod:
          type: string
          enum:
            - CARD_CREDIT
            - CARD_DEBIT
            - UPI
            - NET_BANKING
            - WALLET
            - BANK_TRANSFER
            - USSD
            - MOBILE_MONEY
            - VIRTUAL_ACCOUNT
        gateway:
          type: string
          enum:
            - RAZORPAY
            - STRIPE
            - PAYU
            - UPI
            - PAYSTACK
            - FLUTTERWAVE
            - INTERSWITCH
            - OPAY
          nullable: true
        gatewayPaymentId:
          type: string
          nullable: true
        gatewayReference:
          type: string
          nullable: true
        traceId:
          type: string
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
      required:
        - id
        - merchantId
        - merchantOrderId
        - amountPaise
        - amountRupees
        - capturedPaise
        - refundedPaise
        - currency
        - state
        - paymentMethod
        - gateway
        - gatewayPaymentId
        - gatewayReference
        - traceId
        - createdAt
        - updatedAt
    ListPaymentsResponseDto:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/PaymentResponseDto'
        page:
          type: number
        pageSize:
          type: number
        total:
          type: number
        totalPages:
          type: number
      required:
        - data
        - page
        - pageSize
        - total
        - totalPages
    TimelineEntryDto:
      type: object
      properties:
        id:
          type: string
          format: uuid
        fromState:
          type: string
          enum:
            - CREATED
            - ROUTE_SELECTED
            - AUTH_INITIATED
            - AUTHORISED
            - AUTH_FAILED
            - AUTH_TIMEOUT
            - AUTH_EXPIRED
            - CAPTURE_INITIATED
            - CAPTURED
            - PARTIALLY_CAPTURED
            - CAPTURE_FAILED
            - VOID_INITIATED
            - VOIDED
            - REFUND_INITIATED
            - REFUNDED
            - PARTIALLY_REFUNDED
            - REFUND_FAILED
            - SETTLED
            - DISPUTE_OPENED
            - DISPUTE_RESOLVED
            - ABANDONED
            - ROUTE_FAILED
            - FAILED
        toState:
          type: string
          enum:
            - CREATED
            - ROUTE_SELECTED
            - AUTH_INITIATED
            - AUTHORISED
            - AUTH_FAILED
            - AUTH_TIMEOUT
            - AUTH_EXPIRED
            - CAPTURE_INITIATED
            - CAPTURED
            - PARTIALLY_CAPTURED
            - CAPTURE_FAILED
            - VOID_INITIATED
            - VOIDED
            - REFUND_INITIATED
            - REFUNDED
            - PARTIALLY_REFUNDED
            - REFUND_FAILED
            - SETTLED
            - DISPUTE_OPENED
            - DISPUTE_RESOLVED
            - ABANDONED
            - ROUTE_FAILED
            - FAILED
        event:
          type: string
        triggeredBy:
          type: string
          description: e.g. 'api_server' | 'webhook_processor' | 'reconciliation_engine'
        traceId:
          type: string
          format: uuid
        gatewayReference:
          type: string
          nullable: true
        createdAt:
          type: string
          format: date-time
      required:
        - id
        - fromState
        - toState
        - event
        - triggeredBy
        - traceId
        - gatewayReference
        - createdAt
    RefundResponseDto:
      type: object
      properties:
        id:
          type: string
          format: uuid
        transactionId:
          type: string
          format: uuid
        amountPaise:
          type: number
        amountRupees:
          type: number
        currency:
          type: string
        state:
          type: string
          enum:
            - INITIATED
            - PROCESSING
            - COMPLETED
            - FAILED
            - PARTIALLY_COMPLETED
        gateway:
          type: string
          enum:
            - RAZORPAY
            - STRIPE
            - PAYU
            - UPI
            - PAYSTACK
            - FLUTTERWAVE
            - INTERSWITCH
            - OPAY
        gatewayRefundId:
          type: string
          nullable: true
        reason:
          type: string
          nullable: true
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
      required:
        - id
        - transactionId
        - amountPaise
        - amountRupees
        - currency
        - state
        - gateway
        - gatewayRefundId
        - reason
        - createdAt
        - updatedAt
    SuccessRateByGatewayDto:
      type: object
      properties:
        gateway:
          type: string
        successRate:
          type: number
          description: Fraction between 0 and 1 (captured / total)
        total:
          type: number
      required:
        - gateway
        - successRate
        - total
    VolumeByDayDto:
      type: object
      properties:
        date:
          type: string
          description: YYYY-MM-DD
        count:
          type: number
        totalPaise:
          type: string
          description: Sum of amount_paise for the day, as a string (bigint-safe)
      required:
        - date
        - count
        - totalPaise
    WebhookQueueEntryDto:
      type: object
      properties:
        id:
          type: string
          description: bigint PK, kept as a string to avoid precision loss
        gateway:
          type: string
          enum:
            - RAZORPAY
            - STRIPE
            - PAYU
            - UPI
            - PAYSTACK
            - FLUTTERWAVE
            - INTERSWITCH
            - OPAY
        eventId:
          type: string
        payload:
          type: object
          additionalProperties: true
        status:
          type: string
          enum:
            - PENDING
            - PROCESSING
            - COMPLETED
            - FAILED
            - DLQ
        retryCount:
          type: number
        maxRetries:
          type: number
        nextRetryAt:
          type: string
          format: date-time
          nullable: true
        errorMessage:
          type: string
          nullable: true
        createdAt:
          type: string
          format: date-time
        processedAt:
          type: string
          format: date-time
          nullable: true
      required:
        - id
        - gateway
        - eventId
        - payload
        - status
        - retryCount
        - maxRetries
        - nextRetryAt
        - errorMessage
        - createdAt
        - processedAt
    ReplayWebhookResultDto:
      type: object
      properties:
        replayed:
          type: boolean
      required:
        - replayed
    ReconciliationRunResultDto:
      type: object
      properties:
        runId:
          type: string
          format: uuid
        startedAt:
          type: string
          format: date-time
        completedAt:
          type: string
          format: date-time
        totalChecked:
          type: number
        discrepanciesFound:
          type: number
        autoResolved:
          type: number
        requiresReview:
          type: number
      required:
        - runId
        - startedAt
        - completedAt
        - totalChecked
        - discrepanciesFound
        - autoResolved
        - requiresReview
    AnomalyDto:
      type: object
      properties:
        id:
          type: string
          format: uuid
        runId:
          type: string
          format: uuid
        transactionId:
          type: string
          format: uuid
          nullable: true
        gateway:
          type: string
          enum:
            - RAZORPAY
            - STRIPE
            - PAYU
            - UPI
            - PAYSTACK
            - FLUTTERWAVE
            - INTERSWITCH
            - OPAY
          nullable: true
        discrepancyType:
          type: string
          enum:
            - INTERNAL_CAPTURED_GATEWAY_FAILED
            - INTERNAL_PENDING_GATEWAY_SUCCEEDED
            - AMOUNT_MISMATCH
            - STATUS_MISMATCH
            - MISSING_IN_GATEWAY
          nullable: true
        internalState:
          type: string
          nullable: true
        gatewayState:
          type: string
          nullable: true
        requiresReview:
          type: boolean
        resolved:
          type: boolean
        notes:
          type: string
          nullable: true
        createdAt:
          type: string
          format: date-time
      required:
        - id
        - runId
        - transactionId
        - gateway
        - discrepancyType
        - internalState
        - gatewayState
        - requiresReview
        - resolved
        - notes
        - createdAt
    ResolveAnomalyResultDto:
      type: object
      properties:
        resolved:
          type: boolean
      required:
        - resolved
