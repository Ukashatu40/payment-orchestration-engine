          schema:
            type: number
        - name: to
          required: false
          in: query
          schema:
            format: date-time
            type: string
        - name: from
          required: false
          in: query
          schema:
            format: date-time
            type: string
        - name: gateway
          required: false
          in: query
          schema:
            enum:
              - RAZORPAY
              - STRIPE
              - PAYU
              - UPI
              - PAYSTACK
              - FLUTTERWAVE
              - INTERSWITCH
              - OPAY
            type: string
        - name: state
          required: false
          in: query
          schema:
            enum:
              - CREATED
              - ROUTE_SELECTED
              - AUTH_INITIATED
              - AUTHORISED
              - AUTH_FAILED
              - AUTH_TIMEOUT
              - AUTH_EXPIRED
              - CAPTURE_INITIATED
              - CAPTURED
              - PARTIALLY_CAPTURED
              - CAPTURE_FAILED
              - VOID_INITIATED
              - VOIDED
              - REFUND_INITIATED
              - REFUNDED
              - PARTIALLY_REFUNDED
              - REFUND_FAILED
              - SETTLED
              - DISPUTE_OPENED
              - DISPUTE_RESOLVED
              - ABANDONED
              - ROUTE_FAILED
              - FAILED
            type: string
        - name: merchant_order_id
          required: false
          in: query
          schema: {}
      responses:
        '200':
