openapi: 3.0.0
paths:
  /api/v1/health:
    get:
      operationId: AppController_health_v1
      parameters: []
      responses:
        '200':
          description: Health check passed
      security:
        - X-API-Key: []
      summary: Check application health
      tags:
        - health
  /api/v1/auth/login:
    post:
      operationId: AuthController_login_v1
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginDto'
      responses:
        '200':
          description: Logged in — session cookies set
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionUserDto'
        '401':
          description: Invalid credentials, disabled, or locked account
      summary: Log in with email + password
      tags: &ref_0
        - auth
  /api/v1/auth/refresh:
    post:
      operationId: AuthController_refresh_v1
      parameters: []
      responses:
        '200':
          description: ''
      summary: Rotate the refresh token and issue a new access token
      tags: *ref_0
  /api/v1/auth/logout:
    post:
      operationId: AuthController_logout_v1
      parameters: []
      responses:
        '200':
          description: ''
      summary: Log out — revokes the current refresh token
      tags: *ref_0
  /api/v1/auth/me:
    get:
      operationId: AuthController_me_v1
      parameters: []
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MeResponseDto'
      summary: Get the current authenticated user
      tags: *ref_0
  /api/v1/auth/sessions:
    get:
      operationId: AuthController_sessions_v1
      parameters: []
      responses:
        '200':
          description: ''
      summary: List active sessions (refresh tokens) for the current user
      tags: *ref_0
  /api/v1/auth/sessions/{id}:
    delete:
      operationId: AuthController_revokeSession_v1
      parameters:
        - name: id
          required: true
          in: path
          schema:
            type: string
      responses:
        '200':
          description: ''
      summary: Revoke a specific session (must belong to the current user)
      tags: *ref_0
  /api/v1/gateways:
    get:
      operationId: GatewaysController_listGateways_v1
      parameters: []
      responses:
        '200':
          description: List of payment gateways retrieved
      security: &ref_1
        - X-API-Key: []
      summary: List all payment gateways
      tags: &ref_2
        - gateways
  /api/v1/gateways/{name}/health:
    get:
      operationId: GatewaysController_getGatewayHealth_v1
      parameters:
        - name: name
          required: true
          in: path
          schema:
            type: string
      responses:
        '200':
          description: Health status retrieved
      security: *ref_1
      summary: Get health status of a payment gateway
      tags: *ref_2
  /api/v1/gateways/{name}/metrics:
    get:
      operationId: GatewaysController_getGatewayMetrics_v1
      parameters:
        - name: name
          required: true
          in: path
          schema:
            type: string
      responses:
        '200':
          description: Metrics retrieved
      security: *ref_1
      summary: Get metrics for a payment gateway
      tags: *ref_2
  /api/v1/gateways/{name}/config:
    put:
      operationId: GatewaysController_updateGatewayConfig_v1
      parameters:
        - name: name
          required: true
          in: path
          description: Payment gateway name
          schema:
            enum:
              - RAZORPAY
              - STRIPE
              - PAYU
              - UPI
              - PAYSTACK
              - FLUTTERWAVE
              - INTERSWITCH
              - OPAY
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                isEnabled:
                  type: boolean
                cbFailureThreshold:
                  type: number
                  minimum: 0
                  maximum: 1
              example:
                isEnabled: true
                cbFailureThreshold: 0.3
      responses:
        '200':
          description: Configuration updated
        '403':
          description: Requires SUPER_ADMIN or OPS_ADMIN
      security: *ref_1
      summary: Update configuration for a payment gateway
      tags: *ref_2
  /api/v1/gateways/routing/config:
    get:
      operationId: GatewaysController_getRoutingConfig_v1
      parameters: []
      responses:
        '200':
          description: Routing configuration retrieved
      security: *ref_1
      summary: Get current routing configuration
      tags: *ref_2
    put:
      operationId: GatewaysController_updateRoutingConfig_v1
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                weightSuccessRate:
                  type: number
                  minimum: 0
                  maximum: 1
                weightLatency:
                  type: number
                  minimum: 0
                  maximum: 1
                weightCost:
                  type: number
                  minimum: 0
                  maximum: 1
                weightHealth:
                  type: number
                  minimum: 0
                  maximum: 1
                weightFit:
                  type: number
                  minimum: 0
                  maximum: 1
              example:
                weightSuccessRate: 0.4
                weightLatency: 0.2
                weightCost: 0.2
                weightHealth: 0.1
                weightFit: 0.1
      responses:
        '200':
          description: Routing configuration updated
        '403':
          description: Requires SUPER_ADMIN or OPS_ADMIN
      security: *ref_1
      summary: Update routing configuration
      tags: *ref_2
  /api/v1/payments:
    post:
      operationId: TransactionsController_initiatePayment_v1
      parameters:
        - name: idempotency-key
          required: true
          in: header
          description: UUID v4 idempotency key
          schema:
            type: string
        - name: x-mock-response
          required: true
          in: header
          schema:
            type: string
        - name: x-mock-delay-ms
          required: true
          in: header
          schema:
            type: string
        - name: x-mock-gateway-down
          required: true
          in: header
          schema:
            type: string
        - name: x-merchant-id
          in: header
          description: >-
            Merchant UUID — only honored for legacy API-key callers. Ignored for
            user-session (JWT) callers, whose merchant is derived from their
            session.
          required: false
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InitiatePaymentRequestDto'
      responses:
        '201':
          description: Payment initiated successfully
        '400':
          description: Validation error
        '401':
          description: Invalid or missing credentials
        '409':
          description: Idempotency conflict — request in progress
        '503':
          description: No gateway available
      summary: Initiate a new payment
      tags: &ref_3
        - Transactions
    get:
      operationId: TransactionsController_listOrGetPayments_v1
      parameters:
        - name: pageSize
          required: false
          in: query
          schema:
            type: number
        - name: page
          required: false
          in: query
          schema:
            type: number
        - name: to
          required: false
          in: query
          description: ISO 8601 date
          schema: {}
        - name: from
          required: false
          in: query
          description: ISO 8601 date
          schema: {}
        - name: gateway
          required: false
          in: query
          schema:
            enum:
              - RAZORPAY
              - STRIPE
              - PAYU
              - UPI
              - PAYSTACK
              - FLUTTERWAVE
              - INTERSWITCH
              - OPAY
            type: string
        - name: state
          required: false
          in: query
          schema:
            enum:
              - CREATED
              - ROUTE_SELECTED
              - AUTH_INITIATED
              - AUTHORISED
              - AUTH_FAILED
              - AUTH_TIMEOUT
              - AUTH_EXPIRED
              - CAPTURE_INITIATED
              - CAPTURED
              - PARTIALLY_CAPTURED
              - CAPTURE_FAILED
              - VOID_INITIATED
              - VOIDED
              - REFUND_INITIATED
              - REFUNDED
              - PARTIALLY_REFUNDED
              - REFUND_FAILED
              - SETTLED
              - DISPUTE_OPENED
              - DISPUTE_RESOLVED
              - ABANDONED
              - ROUTE_FAILED
              - FAILED
            type: string
        - name: merchant_order_id
          required: false
          in: query
          schema: {}
      responses:
        '200':
          description: ''
      summary: Look up a payment by merchant_order_id, or list/filter payments
      tags: *ref_3
  /api/v1/payments/{id}:
    get:
      operationId: TransactionsController_getPayment_v1
      parameters:
        - name: id
          required: true
          in: path
          schema:
            type: string
      responses:
        '200':
          description: Payment found
        '403':
          description: Transaction belongs to a different merchant
        '404':
          description: Payment not found
      summary: Retrieve payment details by ID
      tags: *ref_3
  /api/v1/payments/{id}/capture:
    post:
      operationId: TransactionsController_capturePayment_v1
      parameters:
        - name: id
          required: true
          in: path
          schema:
            type: string
      requestBody:
        required: true
        description: Optional amount to capture (for partial captures)
        content:
          application/json:
            schema:
              type: object
              properties:
                amountPaise:
                  type: integer
                  minimum: 1
              example:
                amountPaise: 5000
      responses:
        '200':
          description: Payment captured
        '422':
          description: Invalid state transition
      summary: Capture an authorised payment
      tags: *ref_3
  /api/v1/payments/{id}/void:
    post:
      operationId: TransactionsController_voidPayment_v1
      parameters:
        - name: id
          required: true
          in: path
          schema:
            type: string
      responses:
        '200':
          description: Payment voided
        '422':
          description: Invalid state transition
      summary: Void an authorised payment
      tags: *ref_3
  /api/v1/payments/{id}/refund:
    post:
      operationId: TransactionsController_refundPayment_v1
      parameters:
        - name: id
          required: true
          in: path
          schema:
            type: string
      requestBody:
        required: true
        description: Refund amount and reason
        content:
          application/json:
            schema:
              type: object
              properties:
                amountPaise:
                  type: integer
                  minimum: 1
                reason:
                  type: string
                idempotencyKey:
                  type: string
                  format: uuid
              required:
                - amountPaise
                - idempotencyKey
              example:
                amountPaise: 5000
                reason: Customer requested refund
                idempotencyKey: 123e4567-e89b-12d3-a456-426614174000
      responses:
        '200':
          description: Payment refunded
        '422':
          description: Invalid state transition
      summary: Refund a completed payment
      tags: *ref_3
  /api/v1/payments/{id}/timeline:
    get:
      operationId: TransactionsController_getTimeline_v1
      parameters:
        - name: id
          required: true
          in: path
          schema:
            type: string
      responses:
        '200':
          description: Timeline retrieved
        '404':
          description: Payment not found
      summary: Retrieve payment timeline
      tags: *ref_3
  /api/v1/payments/{id}/refunds:
    get:
      operationId: TransactionsController_getRefunds_v1
      parameters:
        - name: id
          required: true
          in: path
          schema:
            type: string
      responses:
        '200':
          description: Refunds retrieved
        '404':
          description: Payment not found
      summary: List refunds for a payment
      tags: *ref_3
  /api/v1/payments/analytics/success-rate:
    get:
      operationId: TransactionsController_getSuccessRate_v1
      parameters:
        - name: to
          required: false
          in: query
          description: End date for analytics (ISO 8601 format)
          schema: {}
        - name: from
          required: false
          in: query
          description: Start date for analytics (ISO 8601 format)
          schema: {}
      responses:
        '200':
          description: Success rate analytics retrieved
      summary: Get payment success rate analytics
      tags: *ref_3
  /api/v1/payments/analytics/volume:
    get:
      operationId: TransactionsController_getVolume_v1
      parameters:
        - name: to
          required: false
          in: query
          description: End date for analytics (ISO 8601 format)
          schema: {}
        - name: from
          required: false
          in: query
          description: Start date for analytics (ISO 8601 format)
          schema: {}
      responses:
        '200':
          description: Volume analytics retrieved
      summary: Get payment volume analytics
      tags: *ref_3
  /api/v1/webhooks/razorpay:
    post:
      operationId: WebhooksController_razorpayWebhook_v1
      parameters: []
      responses:
        '200':
          description: Webhook received
      security: &ref_4
        - X-API-Key: []
      summary: Handle Razorpay webhook
      tags: &ref_5
        - webhooks
  /api/v1/webhooks/stripe:
    post:
      operationId: WebhooksController_stripeWebhook_v1
      parameters: []
      responses:
        '200':
          description: Webhook received
      security: *ref_4
      summary: Handle Stripe webhook
      tags: *ref_5
  /api/v1/webhooks/payu:
    post:
      operationId: WebhooksController_payuWebhook_v1
      parameters: []
      responses:
        '200':
          description: Webhook received
      security: *ref_4
      summary: Handle PayU webhook
      tags: *ref_5
  /api/v1/webhooks/upi:
    post:
      operationId: WebhooksController_upiWebhook_v1
      parameters: []
      responses:
        '200':
          description: Webhook received
      security: *ref_4
      summary: Handle UPI webhook
      tags: *ref_5
  /api/v1/webhooks/paystack:
    post:
      operationId: WebhooksController_paystackWebhook_v1
      parameters: []
      responses:
        '200':
          description: Webhook received
      security: *ref_4
      summary: Handle Paystack webhook
      tags: *ref_5
  /api/v1/webhooks/flutterwave:
    post:
      operationId: WebhooksController_flutterwaveWebhook_v1
      parameters: []
      responses:
        '200':
          description: Webhook received
      security: *ref_4
      summary: Handle Flutterwave webhook
      tags: *ref_5
  /api/v1/webhooks/interswitch:
    post:
      operationId: WebhooksController_interswitchWebhook_v1
      parameters: []
      responses:
        '200':
          description: Webhook received
      security: *ref_4
      summary: Handle Interswitch webhook
      tags: *ref_5
  /api/v1/webhooks/opay:
    post:
      operationId: WebhooksController_opayWebhook_v1
      parameters: []
      responses:
        '200':
          description: Webhook received
      security: *ref_4
      summary: Handle Opay webhook
      tags: *ref_5
  /api/v1/webhooks/dlq:
    get:
      operationId: WebhooksController_getDLQ_v1
      parameters:
        - name: gateway
          required: true
          in: query
          schema:
            type: string
      responses:
        '200':
          description: Failed webhooks retrieved
      security: *ref_4
      summary: Retrieve failed webhooks
      tags: *ref_5
  /api/v1/webhooks/dlq/{id}/replay:
    post:
      operationId: WebhooksController_replayDLQ_v1
      parameters:
        - name: id
          required: true
          in: path
          schema:
            type: string
      responses:
        '200':
          description: Webhook replayed
        '403':
          description: Requires SUPER_ADMIN or OPS_ADMIN
      security: *ref_4
      summary: Replay a failed webhook
      tags: *ref_5
  /api/v1/reconciliation/trigger:
    post:
      operationId: ReconciliationController_triggerReconciliation_v1
      parameters: []
      responses:
        '200':
          description: Reconciliation triggered
        '403':
          description: Requires SUPER_ADMIN or OPS_ADMIN
      security: &ref_6
        - X-API-Key: []
      summary: Trigger reconciliation process
      tags: &ref_7
        - reconciliation
  /api/v1/reconciliation/reports/{runId}:
    get:
      operationId: ReconciliationController_getReport_v1
      parameters:
        - name: runId
          required: true
          in: path
          schema:
            type: string
      responses:
        '200':
          description: Report retrieved
      security: *ref_6
      summary: Get reconciliation report
      tags: *ref_7
  /api/v1/reconciliation/anomalies:
    get:
      operationId: ReconciliationController_getAnomalies_v1
      parameters: []
      responses:
        '200':
          description: Anomalies retrieved
      security: *ref_6
      summary: Get unresolved anomalies
      tags: *ref_7
  /api/v1/reconciliation/anomalies/{id}/resolve:
    post:
      operationId: ReconciliationController_resolveAnomaly_v1
      parameters:
        - name: id
          required: true
          in: path
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                notes:
                  type: string
              required:
                - notes
              example:
                notes: Confirmed with gateway support — settled, false positive.
      responses:
        '200':
          description: Anomaly marked resolved
        '403':
          description: Requires SUPER_ADMIN or OPS_ADMIN
      security: *ref_6
      summary: Mark an anomaly resolved/investigated
      tags: *ref_7
info:
  title: PayFlow Orchestration Layer
  description: >-
    Production-grade payment orchestration API routing transactions across
    Razorpay, Stripe, PayU, UPI, Paystack, Flutterwave, Interswitch, and Opay
    with intelligent failover, idempotency, and complete audit trails.
  version: 1.0.0
  contact: {}
tags:
  - name: payments
    description: Payment initiation, capture, void, refund
  - name: webhooks
    description: Gateway webhook receivers and DLQ management
  - name: gateways
    description: Gateway health, metrics, and configuration
  - name: reconciliation
    description: Batch reconciliation and anomaly detection
  - name: analytics
    description: Transaction volume and success rate analytics
  - name: health
    description: System health check
servers: []
components:
  securitySchemes:
    X-API-Key:
      type: apiKey
      in: header
      name: X-API-Key
  schemas:
    LoginDto:
      type: object
      properties:
        email:
          type: string
          example: ops-admin@payflow.example
        password:
          type: string
          minLength: 8
          format: password
      required:
        - email
        - password
    SessionUserDto:
      type: object
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
        role:
          type: string
          enum:
            - SUPER_ADMIN
            - OPS_ADMIN
            - OPS_VIEWER
            - MERCHANT_ADMIN
            - MERCHANT_VIEWER
        merchantId:
          type: object
          format: uuid
          nullable: true
      required:
        - id
        - email
        - role
        - merchantId
    MeResponseDto:
      type: object
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
        role:
          type: string
          enum:
            - SUPER_ADMIN
            - OPS_ADMIN
            - OPS_VIEWER
            - MERCHANT_ADMIN
            - MERCHANT_VIEWER
        merchantId:
          type: object
          format: uuid
          nullable: true
        lastLoginAt:
          type: string
          format: date-time
          nullable: true
      required:
        - id
        - email
        - role
        - merchantId
        - lastLoginAt
    InitiatePaymentRequestDto:
      type: object
      properties: {}
